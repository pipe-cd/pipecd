apiVersion: apps/v1
kind: Deployment
metadata:
  name: dchain-second
  labels:
    app: dchain-second
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dchain-second
      pipecd.dev/variant: primary
  template:
    metadata:
      labels:
        app: dchain-second
        pipecd.dev/variant: primary
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
      - name: helloworld
        image: ghcr.io/pipe-cd/helloworld:v0.32.0
        args:
          - server
        ports:
        - containerPort: 9085
