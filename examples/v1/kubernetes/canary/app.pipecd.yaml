apiVersion: pipecd.dev/v1beta1
kind: Application
spec:
  name: canary
  labels:
    env: example
    team: product
  pipeline:
    stages:
      # Roll out CANARY variant at 10% of PRIMARY replicas.
      - name: K8S_CANARY_ROLLOUT
        with:
          replicas: 10%
      # Wait 10 seconds before going to the next stage.
      - name: WAIT
        with:
          duration: 10s
      # Roll out PRIMARY variant to the new version.
      - name: K8S_PRIMARY_ROLLOUT
      # Clean up CANARY variant workloads.
      - name: K8S_CANARY_CLEAN
  plugins:
    kubernetes: {}
  description: |
    This app demonstrates how to deploy a Kubernetes app by Canary strategy without requiring any mesh.
    References: [adding a new app](https://pipecd.dev/docs-v1.0.x/user-guide/managing-application/adding-an-application/), [app configuration](https://pipecd.dev/docs-v1.0.x/user-guide/managing-application/configuration-reference/)
