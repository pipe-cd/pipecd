apiVersion: pipecd.dev/v1beta1
kind: Application
spec:
  name: bluegreen
  labels:
    env: example
    team: product
  pipeline:
    stages:
      # Roll out CANARY variant with the same number of replicas as PRIMARY.
      - name: K8S_CANARY_ROLLOUT
        with:
          replicas: 100%
      # Route all traffic to CANARY variant.
      - name: K8S_TRAFFIC_ROUTING
        with:
          canary: 100
      # Wait for a manual approval on the web console before promoting.
      - name: WAIT_APPROVAL
        with:
          minApproverNum: 1
          # Replace with real usernames.
          approvers:
            - example-user
      # Roll out PRIMARY variant to the new version.
      - name: K8S_PRIMARY_ROLLOUT
      # Route all traffic back to PRIMARY variant.
      - name: K8S_TRAFFIC_ROUTING
        with:
          primary: 100
      # Clean up CANARY variant workloads.
      - name: K8S_CANARY_CLEAN
  plugins:
    kubernetes:
      input:
        manifests:
          - deployment.yaml
          - service.yaml
  description: |
    This app demonstrates how to deploy a Kubernetes app by BlueGreen strategy without requiring any mesh.
    References: [adding a new app](https://pipecd.dev/docs-v1.0.x/user-guide/managing-application/adding-an-application/), [app configuration](https://pipecd.dev/docs-v1.0.x/user-guide/managing-application/configuration-reference/)
