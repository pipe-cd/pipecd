apiVersion: pipecd.dev/v1beta1
kind: EventWatcher
spec:
  events:
    # For those who want to update a file using regex
    - name: image-update-with-regex
      replacements:
        - file: kubernetes/simple/deployment.yaml
          regex: "image: ghcr.io/pipe-cd/helloworld:(v[0-9].[0-9].[0-9])"
