version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/pkg/plugin/sdk"
      - "/tool/actions-gh-release"
      - "/tool/actions-plan-preview"
      - "/tool/codegen/protoc-gen-auth"
      - "/pkg/app/pipedv1/plugin/*"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      google:
        patterns:
          - "google.golang.org/*"
          - "cloud.google.com/*"
      aws-sdk:
        patterns:
          - "github.com/aws/aws-sdk-go-v2*"
      k8s:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      # Clients of the analysis providers. Their minor releases have changed
      # the API, so they are kept apart from the bulk minor/patch group.
      analysis-clients:
        patterns:
          - "github.com/DataDog/datadog-api-client-go*"
          - "github.com/prometheus/*"
      # Minor releases of go-yaml have changed how YAML is rendered.
      go-yaml:
        patterns:
          - "github.com/goccy/go-yaml"
      # Minor releases of fake-gcs-server have changed its API.
      fake-gcs-server:
        patterns:
          - "github.com/fsouza/fake-gcs-server"
      go-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "github.com/DataDog/datadog-api-client-go*"
          - "github.com/prometheus/*"
          - "github.com/goccy/go-yaml"
          - "github.com/fsouza/fake-gcs-server"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "monthly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"
