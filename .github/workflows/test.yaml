name: test

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - 'release-v*'
      - 'feat/*'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GO_VERSION: 1.26.2
  NODE_VERSION: 24.10.0

jobs:
  # Reports whether the pull request touches anything outside documentation.
  # The output is empty on push/tag events so the jobs below always run there.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          # 'every' makes the negated patterns below act as real exclusions.
          predicate-quantifier: every
          filters: |
            code:
              - '!docs/**'
              - '!**/*.md'
              - '**'

  list-go-modules:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    outputs:
      modules: ${{ steps.list-go-modules.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: List go modules
        id: list-go-modules
        run: |
          echo "modules=$(find . -name go.mod -exec dirname {} \; | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> $GITHUB_OUTPUT

  go:
    runs-on: ubuntu-26.04
    needs: list-go-modules
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.list-go-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      # The Go cache is saved only on master because caches saved in a pull request
      # are visible only to that pull request but still count toward the repository
      # cache storage limit. The key contains the date so that master refreshes the
      # cache at most once a day; saving on every push would repeatedly write a full
      # cache set and evict other caches, while keying only on go.sum would leave
      # the build and test caches stale until the dependencies change.
      - name: Compute Go cache parameters
        id: go-cache
        run: |
          {
            echo "paths<<EOF"
            go env GOMODCACHE GOCACHE
            echo "EOF"
            echo "prefix=go-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ matrix.module }}-"
            echo "date=$(date -u +%Y%m%d)"
          } >> "$GITHUB_OUTPUT"
      - name: Restore Go cache
        id: go-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.go-cache.outputs.paths }}
          key: ${{ steps.go-cache.outputs.prefix }}${{ hashFiles(format('{0}/go.sum', matrix.module)) }}-${{ steps.go-cache.outputs.date }}
          restore-keys: |
            ${{ steps.go-cache.outputs.prefix }}${{ hashFiles(format('{0}/go.sum', matrix.module)) }}-
            ${{ steps.go-cache.outputs.prefix }}
      - name: Run unit tests
        run: make test/go COVERAGE=true MODULES=${{ matrix.module }}
      - name: Save Go cache
        if: github.ref == 'refs/heads/master' && steps.go-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.go-cache.outputs.paths }}
          key: ${{ steps.go-cache-restore.outputs.cache-primary-key }}
      - name: make flag
        id: make-flag
        run: |
          echo "flags=$(echo ${{ matrix.module }} | tr '/' '-')" >> $GITHUB_OUTPUT
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          flags: ${{ steps.make-flag.outputs.flags }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # This job is used to check if the go testing is completed successfully
  # It is used to set as required check for the branch protection rules
  go-test-completed:
    runs-on: ubuntu-24.04
    if: always()
    needs: [changes, go]
    steps:
      - name: Check if all go test jobs succeeded
        # if the 'changes' job or any job in the 'go' matrix failed or was cancelled, this job will fail
        # otherwise this job is marked as successful because all steps are skipped
        run: exit 1
        if: >-
          ${{
               contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
          }}

  web:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Update web dependencies
        run: make update/web-deps
      - name: Run unit tests
        run: make test/web

  integration:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run integration tests
        run: make test/integration
