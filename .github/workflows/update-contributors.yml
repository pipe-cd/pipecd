name: Update Contributors Ladder

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: "0 2 * * *"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/update-contributors.yml"
      - "scripts/generate_contributors.py"
  workflow_dispatch:

concurrency:
  group: update-contributors
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-contributors:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run contributor ladder generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_contributors.py \
            --repo "${{ github.repository }}" \
            --output CONTRIBUTORS.md \
            --docs-output docs/content/en/docs-dev/contribution-guidelines/contributor-ladder.md

      - name: Commit and push changes
        run: |
          if git diff --quiet CONTRIBUTORS.md docs/content/en/docs-dev/contribution-guidelines/contributor-ladder.md; then
            echo "No changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CONTRIBUTORS.md docs/content/en/docs-dev/contribution-guidelines/contributor-ladder.md
          git commit -m "docs: update contributors ladder and documentation [skip ci]"
          git push
