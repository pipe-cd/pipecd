name: lint

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - "release-v*"
      - "feat/*"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: 1.26.2
  NODE_VERSION: 24.10.0
  GOLANGCI_LINT_VERSION: v2.11.4
  HELM_VERSION: 3.17.3

jobs:
  # Reports whether the pull request touches anything outside documentation.
  # The output is empty on push/tag events so the jobs below always run there.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          # 'every' makes the negated patterns below act as real exclusions.
          predicate-quantifier: every
          filters: |
            code:
              - '!docs/**'
              - '!**/*.md'
              - '**'

  list-go-modules:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    outputs:
      modules: ${{ steps.list-go-modules.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: List go modules
        id: list-go-modules
        run: |
          echo "modules=$(find . -name go.mod -exec dirname {} \; | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> $GITHUB_OUTPUT

  go:
    runs-on: ubuntu-24.04
    needs: list-go-modules
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.list-go-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: golangci-lint
        uses: reviewdog/action-golangci-lint@c76cceaaab89abe74e649d2e34c6c9adc26662d2 #v2.10.0
        with:
          workdir: ${{ matrix.module }}
          go_version: ${{ env.GO_VERSION }}
          golangci_lint_version: ${{ env.GOLANGCI_LINT_VERSION }}
          golangci_lint_flags: --config ${{ github.workspace }}/.golangci.yml
          fail_level: error
          filter_mode: nofilter

  # This job is used to check if the go linting is completed successfully
  # It is used to set as required check for the branch protection rules
  go-lint-completed:
    runs-on: ubuntu-24.04
    if: always()
    needs: [changes, go]
    steps:
      - name: Check if all go lint jobs succeeded
        # if the 'changes' job or any job in the 'go' matrix failed or was cancelled, this job will fail
        # otherwise this job is marked as successful because all steps are skipped
        run: exit 1
        if: >-
          ${{
               contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
          }}

  web:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Update web dependencies
        run: make update/web-deps
      - name: Run lint
        run: make lint/web
  helm:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint all Helm charts
        run: make lint/helm

  govulncheck:
    runs-on: ubuntu-24.04
    needs: list-go-modules
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.list-go-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        working-directory: ${{ matrix.module }}
        # TODO: Remove continue-on-error once vulnerabilities are fixed (see #6600)
        continue-on-error: true
        run: govulncheck ./...

  govulncheck-completed:
    runs-on: ubuntu-24.04
    if: always()
    needs: govulncheck
    steps:
      - name: Check govulncheck status
        # Warn-only for now until vulnerabilities are fixed (see #6600)
        run: |
          echo "::warning::govulncheck found vulnerabilities - see issue #6600 for tracking"
        if: >-
          ${{
               needs.govulncheck.result == 'failure'
            || needs.govulncheck.result == 'cancelled'
          }}
